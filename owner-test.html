    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 50% -10%,rgba(199,158,75,.13),transparent 35%),radial-gradient(circle at 85% 20%,rgba(125,78,28,.08),transparent 25%),#050504;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif;line-height:1.75}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{width:min(1180px,calc(100vw - 28px));margin:auto;padding:26px 0 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--line)}.brand{font-family:Georgia,serif;letter-spacing:.22em;color:var(--gold2);font-size:20px}.badge{border:1px solid var(--gold);border-radius:999px;padding:5px 12px;color:var(--gold2);font-size:12px}.panel{margin-top:24px;padding:28px;border:1px solid var(--line);border-radius:var(--radius);background:rgba(13,11,7,.94)}.hidden{display:none!important}h1,h2,h3{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-weight:500}h1{font-size:clamp(30px,5vw,48px);margin:16px 0 8px}h2{font-size:clamp(24px,3vw,32px);margin:0 0 8px}h3{font-size:19px}p{margin:8px 0}.muted{color:var(--muted)}.eyebrow{letter-spacing:.22em;color:var(--gold);font-size:11px;text-transform:uppercase}.button{min-height:50px;border-radius:999px;border:1px solid var(--line);padding:0 22px;background:transparent;color:var(--gold2);display:inline-flex;align-items:center;justify-content:center;gap:8px}.button.primary{border:0;background:linear-gradient(135deg,#f0d999,#bd913e);color:#181106;font-weight:700}.button:disabled{opacity:.5;cursor:not-allowed}.error{margin-top:12px;padding:11px 13px;border:1px solid rgba(230,161,156,.4);border-radius:10px;color:#efbbb5;background:rgba(90,35,31,.2)}.notice{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(215,182,108,.05);color:#d9cfbd}.advisor-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:22px}.advisor{padding:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#080704;color:var(--text);text-align:left;display:grid;grid-template-rows:auto 1fr}.advisor img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center top;display:block}.advisor-body{padding:13px;display:grid;grid-template-rows:auto auto 1fr;min-height:122px}.advisor strong{display:block;color:var(--gold2);font-size:18px;line-height:1.35;word-break:keep-all;overflow-wrap:normal}.advisor small{color:var(--muted);display:block;margin-top:5px;line-height:1.55}.advisor .tag{color:#d7c99f;font-size:12px;margin-top:8px}.advisor.selected{border-color:var(--gold2);box-shadow:0 0 0 2px rgba(215,182,108,.18)}.advisor[data-long="true"] strong{font-size:16px;letter-spacing:-.02em}.selection-action{display:flex;justify-content:center;margin-top:28px}.chat-head{display:grid;grid-template-columns:78px 1fr auto;gap:14px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line)}.chat-head img{width:78px;height:78px;object-fit:cover;object-position:center top;border-radius:50%;border:1px solid var(--gold)}.messages{min-height:300px;max-height:520px;overflow:auto;padding:18px 2px}.message{display:flex;margin:12px 0}.message.user{justify-content:flex-end}.bubble{max-width:min(78%,680px);padding:12px 15px;border-radius:16px;background:#151109;border:1px solid var(--line);white-space:pre-wrap}.message.user .bubble{background:linear-gradient(135deg,#d8b765,#ad8134);color:#171006;border:0}.controls{border-top:1px solid var(--line);padding-top:16px}.choices{display:flex;flex-wrap:wrap;gap:9px}.choice{border:1px solid var(--line);border-radius:999px;background:#080704;color:var(--gold2);padding:10px 16px}.input-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.field{display:block;margin:18px 0}.field span{display:block;margin-bottom:7px;color:#d7cdbb;font-size:13px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;background:#070604;color:var(--text);padding:14px;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(215,182,108,.08)}.birth-wheel{display:grid;grid-template-columns:1.25fr .8fr .8fr;gap:10px}.birth-wheel label{display:block}.birth-wheel span{display:block;color:#d7cdbb;font-size:12px;margin-bottom:6px}.birth-wheel select{width:100%;height:150px;border:1px solid var(--line);border-radius:14px;background:#070604;color:var(--text);padding:6px;overflow:auto}.birth-wheel option{padding:7px 10px}.method-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.method-card{border:1px solid var(--line);border-radius:16px;background:#080704;color:var(--text);padding:16px;text-align:left;min-height:150px}.method-card strong{display:block;color:var(--gold2);font-size:18px;margin-bottom:6px}.method-card p{font-size:13px;color:var(--muted);margin:0}.method-card small{display:block;color:#d8c58c;margin-top:10px}.method-card.selected{border-color:var(--gold2);box-shadow:0 0 0 2px rgba(215,182,108,.18)}.summary{display:grid;grid-template-columns:180px 1fr;gap:7px 14px;margin:14px 0}.summary dt{color:var(--muted)}.summary dd{margin:0}.progress{text-align:center;padding:34px 12px}.orb{width:150px;height:150px;border:1px solid var(--gold);border-radius:50%;margin:0 auto 24px;display:grid;place-items:center;position:relative}.orb:before,.orb:after{content:"";position:absolute;border:1px solid rgba(215,182,108,.28);border-radius:50%;inset:18px}.orb:after{inset:40px;animation:spin 4s linear infinite;border-style:dashed}@keyframes spin{to{transform:rotate(360deg)}}.count{font:34px Georgia;color:var(--gold2)}.estimate{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--gold2);margin-bottom:18px}.waiting-content{margin:24px auto 0;max-width:720px;border:1px solid var(--line);border-radius:18px;padding:20px;background:#0a0805;text- op:14px}.tarot-art{height:190px;margin:18px 10px;display:grid;place-items:center;border:1px solid rgba(215,182,108,.25);border-radius:50% 50% 38% 38%;font-size:78px;color:var(--gold2);background:radial-gradient(circle,rgba(215,182,108,.12),transparent 68%)}.tarot-card h3{text-align:center;color:var(--gold2);margin:5px 0}.tarot-card .position{text-align:center;color:#c6b78f;font-size:12px}.tarot-card p{font-size:13px;color:var(--muted)}.section-title{text-align:center;margin:46px 0 18px}.narratives{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.narrative,.day{border:1px solid var(--line);border-radius:14px;padding:18px;background:#0a0805}.days{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.day strong{color:var(--gold2)}.reminder{margin-top:26px;padding:20px;border:1px solid var(--line);border-radius:16px;background:#0b0906}.reminder.hidden-by-need{display:none}.reminder-options{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.reminder-options label{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:9px 14px}.reminder-plan{font-size:13px;color:var(--muted);margin-top:10px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}@media(max-width:900px){.advisor-grid{grid-template-columns:repeat(3,1fr)}.method-grid{grid-template-columns:1fr}.tarot-grid{grid-template-columns:1fr}.narratives,.days{grid-template-columns:1fr}}@media(max-width:620px){.wrap{width:min(100% - 16px,1180px)}.panel{padding:17px}.advisor-grid{grid-template-columns:1fr 1fr}.chat-head{grid-template-columns:64px 1fr}.chat-head img{width:64px;height:64px}.chat-head .button{grid-column:1/-1}.input-row{grid-template-columns:1fr}.bubble{max-width:90%}.summary{grid-template-columns:1fr}.summary dt{margin-top:8px}.birth-wheel{grid-template-columns:1fr 1fr 1fr}.birth-wheel select{height:132px;padding:4px}.choice-compare{grid-template-columns:1fr}.advisor strong{font-size:16px}}

<body>
  <main class="wrap">
    <header class="top"><div class="brand">ORBITA</div><div class="badge">運営者テスト v2</div></header>
    <section id="gate" class="panel"><p class="muted">公開サイトからはリンクしていません。</p><h1>運営者テスト</h1><p>予約枠を使わず、チャットから結果表示まで確認できます。</p><label class="field"><span>アクセスキー</span><input id="access-key" type="password" autocomplete="off" placeholder="アクセスキーを入力"></label><button id="unlock" class="button primary" type="button">テストを開始</button><div id="gate-error" class="error hidden"></div></section>
    <section id="advisor-panel" class="panel hidden"><p class="eyebrow">STEP 1</p><p class="muted">実際の予約枠には影響しません。どの時間帯でも試せます。</p><h1>鑑定パートナーを選ぶ</h1><div id="advisor-grid" class="advisor-grid"></div><div class="selection-action"><button id="start-chat" class="button primary" type="button" disabled>この相手でチャットを試す</button></div></section>
    <section id="chat-panel" class="panel hidden"><div id="chat-head" class="chat-head"></div><div id="messages" class="messages" aria-live="polite"></div><div id="controls" class="controls"></div></section>
    <section id="waiting-panel" class="panel hidden"><div class="progress"><div class="estimate" id="estimate-label">今回の目安を計算中</div><div class="orb"><div class="count" id="countdown">--</div></div><h1 id="waiting-title">結果をまとめています</h1><p class="muted" id="waiting-detail">相談内容と選んだ占い方法を読み合わせています。</p><div class="waiting-content" id="waiting-content"></div><div class="waiting-dots" id="waiting-dots"></div></div></section>
    <section id="result-panel" class="panel hidden"><div id="result-root"></div></section>
  </main>
  <script type="module">
    import { ADVISORS, getAdvisor, getMethod } from './advisors.js?v=3.2.0';
    import { generateReading } from './engine.js?v=3.2.0';
    const ACCESS_KEY='ORB-OEWA-OZ29',ACCESS_STORE='orbita_owner_test_access_v2',REMINDER_STORE='orbita_owner_reminder_test_v1';
    const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
    const panels=['gate','advisor-panel','chat-panel','waiting-panel','result-panel'];
    const CATEGORY_LABELS={love:'恋愛',work:'仕事・転職',relationship:'人間関係',money:'お金',life:'人生・将来',other:'その他'};
    const TIME_LABELS={'7days':'7日以内','1month':'1か月以内','3months':'3か月以内','1year':'1年以内'};
    const METHOD_DETAILS={decision:{title:'二つの候補を比較',desc:'二つの進み方を比べ、今はどちらから動く方がよいかを出します。',best:'決断を後押ししてほしい方'},tarot:{title:'タロット',desc:'3枚のカードから、今の状況・注意点・次の行動を読みます。',best:'気持ちや流れを知りたい方'},numerology:{title:'数秘術',desc:'生年月日の数字から、考え方の傾向と動きやすい時期を読みます。',best:'自分の傾向を知りたい方'},astrology:{title:'星読み',desc:'時期の流れを中心に、急ぐ部分と待つ部分を分けます。',best:'タイミングを知りたい方'},oracle:{title:'オラクル',desc:'今の自分に必要な一言と、心を整える行動を出します。',best:'優しく背中を押してほしい方'},intuition:{title:'直感リーディング',desc:'相談文の中で繰り返される言葉から、本音と迷いの中心を整理します。',best:'本音をはっきりさせたい方'}};
    let selectedAdvisorId='',stepIndex=0,answers={},messages=[],result=null;
    function showPanel(id){panels.forEach(n=>document.getElementById(n)?.classList.toggle('hidden',n!==id));window.scrollTo({top:0,behavior:'smooth'})}
    function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function grantAccess(){const v=$('#access-key').value.trim();if(v!==ACCESS_KEY){$('#gate-error').textContent='アクセスキーが違います。';$('#gate-error').classList.remove('hidden');return}sessionStorage.setItem(ACCESS_STORE,String(Date.now()+12*60*60*1000));renderAdvisors();showPanel('advisor-panel')}
    function hasAccess(){return Number(sessionStorage.getItem(ACCESS_STORE)||0)>Date.now()}
    function renderAdvisors(){$('#advisor-grid').innerHTML=ADVISORS.map(a=>`<button class="advisor" data-advisor="${esc(a.id)}" data-long="${a.name.length>=8}"><img src="${esc(a.image)}?v=3.2.0" alt="${esc(a.name)}"><div class="advisor-body"><strong>${esc(a.name)}</strong><small>${esc(a.tagline)}</small><span class="tag">${a.age}歳・${esc(a.type)}</span></div></button>`).join('');$$('[data-advisor]').forEach(b=>b.addEventListener('click',()=>{selectedAdvisorId=b.dataset.advisor;$$('[data-advisor]').forEach(i=>i.classList.toggle('selected',i===b));$('#start-chat').disabled=false}))}
    function addMessage(role,text){messages.push({role,text});renderMessages()}
    function renderMessages(){$('#messages').innerHTML=messages.map(m=>`<div class="message ${m.role}"><div class="bubble">${esc(m.text)}</div></div>`).join('');$('#messages').scrollTop=$('#messages').scrollHeight}
    function startChat(){const a=getAdvisor(selectedAdvisorId);stepIndex=0;answers={};messages=[];$('#chat-head').innerHTML=`<img src="${esc(a.image)}?v=3.2.0" alt="${esc(a.name)}"><div><h2>${esc(a.name)}</h2><p class="muted">${esc(a.tagline)}</p></div><button id="change-advisor" class="button" type="button">相手を変える</button>`;$('#change-advisor').addEventListener('click',()=>showPanel('advisor-panel'));addMessage('agent',`${a.name}です。今日はどんなことで迷っていますか？`);addMessage('agent','一つずつ質問します。短い回答でも大丈夫です。');showPanel('chat-panel');renderStep()}
    const steps=[{key:'nickname',type:'text',prompt:'鑑定の中でお呼びする名前を教えてください。',label:'呼び名',placeholder:'例：ミナ'},{key:'birthdate',type:'birth',prompt:'生年月日を教えてください。上下にスクロールして選べます。'},{key:'category',type:'choice',prompt:'今回の相談に一番近いものを選んでください。',choices:Object.entries(CATEGORY_LABELS)},{key:'question',type:'textarea',prompt:'いま迷っていることを教えてください。短くても構いません。',label:'相談内容',placeholder:'例：今の仕事を続けるか、新しい仕事に移るか迷っています。'},{key:'option1',type:'text',prompt:'一つ目の候補を入力してください。',label:'候補1',placeholder:'例：今の仕事を続ける'},{key:'option2',type:'text',prompt:'もう一つの候補を入力してください。',label:'候補2',placeholder:'例：新しい仕事に移る'},{key:'timeframe',type:'choice',prompt:'いつ頃までに方向を決めたいですか？',choices:Object.entries(TIME_LABELS)},{key:'tension',type:'choice',prompt:'迷いの強さを選んでください。1は軽い迷い、10はかなり強い迷いです。',choices:Array.from({length:10},(_,i)=>[String(i+1),String(i+1)])},{key:'method',type:'method',prompt:'最後に、今回使う占い方法を選んでください。'},{key:'confirm',type:'confirm',prompt:'内容を確認してください。'}];
    function renderStep(){const s=steps[stepIndex];if(!messages.length||messages.at(-1).text!==s.prompt)addMessage('agent',s.prompt);const r=$('#controls');if(s.type==='choice'){r.innerHTML=`<div class="choices">${s.choices.map(([v,l])=>`<button class="choice" type="button" data-value="${esc(v)}">${esc(l)}</button>`).join('')}</div>`;$$('[data-value]',r).forEach(b=>b.addEventListener('click',()=>submitStep(b.dataset.value,b.textContent)));return}if(s.type==='birth'){const now=new Date(),ys=Array.from({length:100},(_,i)=>String(now.getFullYear()-18-i)),ms=Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0')),ds=Array.from({length:31},(_,i)=>String(i+1).padStart(2,'0'));r.innerHTML=`<div class="birth-wheel"><label><span>年</span><select id="birth-year" size="5"><option value="">選択</option>${ys.map(v=>`<option value="${v}">${v}</option>`).join('')}</select></label><label><span>月</span><select id="birth-month" size="5"><option value="">選択</option>${ms.map(v=>`<option value="${v}">${v}</option>`).join('')}</select></label><label><span>日</span><select id="birth-day" size="5"><option value="">選択</option>${ds.map(v=>`<option value="${v}">${v}</option>`).join('')}</select></label></div><div class="actions"><button id="send-birth" class="button primary" type="button">この日付で送信</button></div><div id="input-error" class="error hidden"></div>`;$('#send-birth').addEventListener('click',()=>{const y=$('#birth-year').value,m=$('#birth-month').value,d=$('#birth-day').value,v=`${y}-${m}-${d}`,date=new Date(`${v}T12:00:00`);if(!y||!m||!d||Number.isNaN(date.getTime())||date.getFullYear()!==Number(y)||date.getMonth()+1!==Number(m)||date.getDate()!==Number(d)){const e=$('#input-error');e.textContent='正しい生年月日を選んでください。';e.classList.remove('hidden');return}submitStep(v,`${y}年${Number(m)}月${Number(d)}日`)});return}if(s.type==='method'){const a=getAdvisor(selectedAdvisorId);r.innerHTML=`<div class="method-grid">${a.methods.map(id=>{const d=METHOD_DETAILS[id]||{title:getMethod(id).name,desc:getMethod(id).short,best:''};return `<button class="method-card" type="button" data-method="${id}"><strong>${esc(d.title)}</strong><p>${esc(d.desc)}</p><small>向いている方：${esc(d.best)}</small></button>`}).join('')}</div>`;$$('[data-method]',r).forEach(b=>b.addEventListener('click',()=>{$$('[data-method]',r).forEach(i=>i.classList.toggle('selected',i===b));setTimeout(()=>submitStep(b.dataset.method,METHOD_DETAILS[b.dataset.method]?.title||getMethod(b.dataset.method).name),180)}));return}if(s.type==='confirm'){r.innerHTML=`<div class="summary"><dt>呼び名</dt><dd>${esc(answers.nickname)}</dd><dt>相談分野</dt><dd>${esc(CATEGORY_LABELS[answers.category])}</dd><dt>相談内容</dt><dd>${esc(answers.question)}</dd><dt>候補1</dt><dd>${esc(answers.option1)}</dd><dt>候補2</dt><dd>${esc(answers.option2)}</dd><dt>決めたい時期</dt><dd>${esc(TIME_LABELS[answers.timeframe])}</dd><dt>迷いの強さ</dt><dd>${esc(answers.tension)}/10</dd><dt>占い方法</dt><dd>${esc(METHOD_DETAILS[answers.method]?.title||getMethod(answers.method).name)}</dd></div><label class="field"><span><input id="adult" type="checkbox"> 18歳以上で、結果は重要な判断の代わりではないことを確認しました</span></label><div id="confirm-error" class="error hidden"></div><div class="actions"><button id="back-step" class="button" type="button">一つ戻る</button><button id="confirm-reading" class="button primary" type="button">この内容で占う</button></div>`;$('#back-step').addEventListener('click',()=>{stepIndex=Math.max(0,stepIndex-1);renderStep()});$('#confirm-reading').addEventListener('click',prepareReading);return}const input=s.type==='textarea'?`<textarea id="chat-input" rows="4" maxlength="300" placeholder="${esc(s.placeholder||'')}"></textarea>`:`<input id="chat-input" type="text" maxlength="120" placeholder="${esc(s.placeholder||'')}">`;r.innerHTML=`<div class="input-row"><label class="field"><span>${esc(s.label||'回答')}</span>${input}</label><button id="send" class="button primary" type="button">送信</button></div><div id="input-error" class="error hidden"></div>`;$('#send').addEventListener('click',()=>submitStep($('#chat-input').value,$('#chat-input').value));$('#chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!(s.type==='textarea'&&e.shiftKey)){e.preventDefault();$('#send').click()}});setTimeout(()=>$('#chat-input').focus(),50)}
    function submitStep(value,label){const s=steps[stepIndex],clean=String(value??'').trim();if(!clean){const e=$('#input-error');if(e){e.textContent='入力してください。';e.classList.remove('hidden')}return}if(s.key==='question'&&clean.length<8){const e=$('#input-error');e.textContent='相談内容を8文字以上で入力してください。';e.classList.remove('hidden');return}if(s.key==='option2'&&clean===answers.option1){const e=$('#input-error');e.textContent='候補1とは違う内容を入力してください。';e.classList.remove('hidden');return}answers[s.key]=clean;addMessage('user',label||clean);stepIndex++;renderStep()}
    function calculateEstimate(){const q=answers.question||'',mw={decision:8,tarot:14,numerology:10,astrology:14,oracle:8,intuition:12}[answers.method]||10,tw=Math.min(28,Math.round(q.length/7)),sw=Math.round(Number(answers.tension||5)*1.2);return Math.max(28,Math.min(82,24+mw+tw+sw))}
    function prepareReading(){if(!$('#adult').checked){const e=$('#confirm-error');e.textContent='確認欄にチェックしてください。';e.classList.remove('hidden');return}const a=getAdvisor(selectedAdvisorId),input={nickname:answers.nickname,birthdate:answers.birthdate,category:answers.category,question:answers.question,optionA:answers.option1,optionB:answers.option2,timeframe:answers.timeframe,tension:Number(answers.tension),readingDate:new Date().toISOString().slice(0,10),advisorId:a.id,advisorName:a.name,advisorTone:a.tone,method:answers.method,bookingStart:new Date().toISOString()};result=generateReading(input);if(!result.ok){const e=$('#confirm-error');e.textContent=(result.errors||[result.safety?.message||'入力内容を確認してください。']).join(' ');e.classList.remove('hidden');return}startWaiting(calculateEstimate(),a)}
    function waitingItems(a){const m=METHOD_DETAILS[answers.method]||{};return[{title:`${a.name}の見方`,body:a.tagline},{title:`今回の占い方法：${m.title}`,body:m.desc},{title:'待っている間の小さな準備',body:'肩の力を抜き、候補1と候補2を選んだときの体の反応を一度だけ思い出してみてください。'},{title:'結果で分かること',body:'おすすめする方向、そう考える理由、注意点、今日からできる最初の行動をまとめます。'},{title:'結果は準備でき次第表示',body:'固定の3分待機ではありません。今回の相談量と占い方法から見積もった時間を使っています。'}]}
    function startWaiting(seconds,a){showPanel('waiting-panel');const items=waitingItems(a);let idx=0;const dots=$('#waiting-dots');dots.innerHTML=items.map((_,i)=>`<span class="${i===0?'active':''}"></span>`).join('');const show=()=>{const item=items[idx];$('#waiting-content').innerHTML=`<h3>${esc(item.title)}</h3><p>${esc(item.body)}</p>`;[...dots.children].forEach((d,i)=>d.classList.toggle('active',i===idx));idx=(idx+1)%items.length};show();const it=setInterval(show,6000),end=Date.now()+seconds*1000;$('#estimate-label').textContent=`今回の目安：約${seconds}秒`;const t=setInterval(()=>{const remain=Math.max(0,Math.ceil((end-Date.now())/1000));$('#countdown').textContent=`${remain}秒`;if(remain<=0){clearInterval(t);clearInterval(it);renderResult()}},250)}
    function recommendationData(){const delta=result.scores.a-result.scores.b,pick=delta>=0?1:2,selected=pick===1?answers.option1:answers.option2,strength=Math.abs(delta)>=18?'強めにおすすめ':Math.abs(delta)>=8?'ややおすすめ':'まず小さく試す',reasons=[`今回の占いでは「${selected}」の方が、今の状況と合わせやすい結果です。`,result.reversibility>=60?'始めても途中で調整しやすく、大きな失敗につながりにくい流れです。':'始める前に条件を決めれば、無理なく試せる流れです。',`中心のタロット「${result.cards[0].name}」は、${result.cards[0].light}`],firstAction=result.cards[0].action||result.plan[0].body;return{pick,selected,strength,reasons,firstAction}}
    function renderResult(){showPanel('result-panel');const a=getAdvisor(selectedAdvisorId),rec=recommendationData(),p1=result.scores.a,p2=result.scores.b,need=Number(answers.tension)>=7||result.clarity<58;$('#result-root').innerHTML=`<div class="result-head"><p class="eyebrow">TEST RESULT</p><h1>${esc(answers.nickname)}さんの鑑定結果</h1><p>${esc(a.name)}｜${esc(METHOD_DETAILS[answers.method]?.title||getMethod(answers.method).name)}</p></div><section class="recommend"><span class="label">${esc(rec.strength)}</span><h2>今回は「${esc(rec.selected)}」をおすすめします</h2><p>断定ではありませんが、今の相談内容ではこちらから動く方が現実的です。</p><ul>${rec.reasons.map(r=>`<li>${esc(r)}</li>`).join('')}</ul><div class="action-box"><strong>今日やること</strong><p>${esc(rec.firstAction)}</p></div></section><div class="choice-compare"><article class="choice-result ${rec.pick===1?'recommended':''}"><small>候補1</small><strong>${esc(answers.option1)}</strong><p>${rec.pick===1?'今回はこちらを優先':'今回は二番目の候補'}</p><div class="meter"><i style="width:${p1}%"></i></div><small>おすすめの強さ：${p1>=60?'高め':p1>=50?'やや高め':'慎重'}</small></article><article class="choice-result ${rec.pick===2?'recommended':''}"><small>候補2</small><strong>${esc(answers.option2)}</strong><p>${rec.pick===2?'今回はこちらを優先':'今回は二番目の候補'}</p><div class="meter"><i style="width:${p2}%"></i></div><small>おすすめの強さ：${p2>=60?'高め':p2>=50?'やや高め':'慎重'}</small></article></div><h2 class="section-title">3枚のタロット</h2><div class="tarot-grid">${result.cards.map((c,i)=>`<article class="tarot-card"><div class="tarot-number">${String(i+1).padStart(2,'0')}</div><div class="tarot-art">${esc(c.glyph)}</div><div class="position">${['今の状況','気をつけたいこと','次の行動'][i]}</div><h3>${esc(c.name)}</h3><p>${esc(i===1?c.shadow:c.light)}</p><p><strong>行動：</strong>${esc(c.action)}</p></article>`).join('')}</div><h2 class="section-title">今回の読み解き</h2><div class="narratives"><article class="narrative"><h3>おすすめする理由</h3><p>${esc(result.narrative.overview)}</p></article><article class="narrative"><h3>気をつけたい点</h3><p>${esc(result.narrative.hidden)}</p></article><article class="narrative"><h3>動く前に決めること</h3><p>${esc(result.narrative.timing)}</p></article><article class="narrative"><h3>最後の後押し</h3><p>${esc(result.narrative.closing)}</p></article></div><h2 class="section-title">次の7日間でやること</h2><div class="days">${result.plan.map(item=>`<article class="day"><strong>${item.day}日目：${esc(item.title)}</strong><p>${esc(item.body)}</p></article>`).join('')}</div><section id="reminder-box" class="reminder ${need?'':'hidden-by-need'}"><h3>必要な日だけメッセージを受け取る</h3><p>今回は迷いが強め、または判断材料が少ないため、1日目・3日目・5日目・7日目に短い確認メッセージを出す設定を試せます。</p><div class="reminder-options"><label><input type="radio" name="reminder-time" value="morning"> 朝 8:00</label><label><input type="radio" name="reminder-time" value="night"> 夜 21:00</label><label><input type="radio" name="reminder-time" value="none" checked> 受け取らない</label></div><button id="save-reminder" class="button primary" type="button">メッセージ設定を保存</button> <button id="test-notification" class="button" type="button">通知を今すぐ試す</button><p class="reminder-plan" id="reminder-plan">静的なテストページでは設定保存と即時通知の確認まで行えます。閉じている間の毎日配信には、本番用のプッシュ通知サーバーが必要です。</p></section><div class="actions"><button id="retry" class="button primary" type="button">別の内容で試す</button><button id="change-person" class="button" type="button">相手を変える</button></div><p class="notice">この結果は運営者テストです。重要な医療・法律・金融・安全上の判断の代わりには使用しないでください。</p>`;$('#retry').addEventListener('click',startChat);$('#change-person').addEventListener('click',()=>showPanel('advisor-panel'));$('#save-reminder')?.addEventListener('click',saveReminder);$('#test-notification')?.addEventListener('click',testNotification)}
    function saveReminder(){const v=$('input[name="reminder-time"]:checked')?.value||'none',payload={time:v,days:v==='none'?[]:[1,3,5,7],savedAt:new Date().toISOString()};localStorage.setItem(REMINDER_STORE,JSON.stringify(payload));$('#reminder-plan').textContent=v==='none'?'メッセージを受け取らない設定で保存しました。':`${v==='morning'?'朝8:00':'夜21:00'}、1・3・5・7日目に送る設定を保存しました。`}
    async function testNotification(){if(!('Notification'in window)){alert('このブラウザは通知に対応していません。');return}const p=await Notification.requestPermission();if(p!=='granted'){alert('通知が許可されませんでした。');return}new Notification('ORBITA テスト通知',{body:'今日の一歩を確認する時間です。結果画面の「今日やること」を一つだけ試してみましょう。'})}
    $('#unlock').addEventListener('click',grantAccess);$('#access-key').addEventListener('keydown',e=>{if(e.key==='Enter')grantAccess()});$('#start-chat').addEventListener('click',startChat);if(hasAccess()){renderAdvisors();showPanel('advisor-panel')}
